<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONTIX Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div id="login" class="screen"><div class="login-card"><div class="brand">CONTIX</div><h1>Owner Admin</h1><p>Build/test control center</p><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginErr"></div></form></div></div><div id="app" hidden><aside class="side"><div class="brand">CONTIX</div><button data-tab="overview">Overview</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="handover">Customer handover</button><button data-tab="ownerai">Owner AI</button><button id="logout">Log out</button></aside><main class="admin-main"><section id="overview" class="tab"><h1>Store overview</h1><div id="stats" class="stats"></div></section><section id="products" class="tab" hidden><div class="bar"><div><h1>Products</h1><p>Add, edit, publish and manage stock.</p></div><button class="primary" id="newProduct">Add product</button></div><div id="productTable" class="table"></div></section><section id="orders" class="tab" hidden><h1>Orders</h1><div id="ordersTable" class="table"></div></section><section id="handover" class="tab" hidden><h1>Customer handover</h1><div id="handoverTable" class="table"></div></section><section id="ownerai" class="tab" hidden><h1>Owner AI</h1><div class="ai-box"><div id="ownerLog"></div><div class="row"><input id="ownerInput" placeholder="Ask about stock, orders or the catalog..."><button class="primary" id="ownerSend">Ask</button></div></div></section></main></div><dialog id="productDialog"><form method="dialog" id="productForm"><h2 id="dialogTitle">Add product</h2><input type="hidden" name="id"><input name="name" placeholder="Product name" required><div class="two"><input name="brand" placeholder="Brand"><input name="category" placeholder="Category" required></div><div class="three"><input name="price" type="number" placeholder="Price (NGN)" required><input name="old_price" type="number" placeholder="Old price"><input name="stock" type="number" placeholder="Stock" required></div><div class="two"><input name="sku" placeholder="SKU"><select name="condition"><option>New</option><option>Used</option><option>Refurbished</option></select></div><textarea name="description" placeholder="Description"></textarea><textarea name="specs" placeholder="Specifications"></textarea><label>Image URLs (one per line)<textarea name="images" placeholder="https://..."></textarea></label><div class="checks"><label><input type="checkbox" name="featured"> Featured</label><label><input type="checkbox" name="is_own" checked> Own product</label><label><input type="checkbox" name="published" checked> Published</label></div><div class="dialog-actions"><button value="cancel">Cancel</button><button class="primary" value="default">Save product</button></div></form></dialog><script src="/admin.js"></script></body></html>
