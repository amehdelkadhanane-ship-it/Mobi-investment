<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Contix Phones</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin-style.css"></head><body><header><a class="logo" href="index.html">▣ Contix <b>Phones</b></a><a href="index.html">View Store ↗</a></header><main class="wrap"><section id="login" class="card login"><small>PRIVATE AREA</small><h1>Admin Login</h1><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><button>Login</button></form><p>Demo password: <b>contix123</b>. Change it in app.js before publishing.</p></section><section id="dashboard" hidden><div class="title"><div><small>CONTROL PANEL</small><h1>Store Management</h1></div><button id="logout">Logout</button></div><div class="tabs"><button data-tab="products" class="active">Products</button><button data-tab="payments">Payment Settings</button><button data-tab="orders">Orders</button></div><div id="productsTab"><div class="row"><div><h2>Products</h2><p>Add product pictures, prices and specifications.</p></div><button id="add">+ Add Product</button></div><div id="adminProducts" class="adminGrid"></div></div><div id="paymentsTab" hidden class="card"><h2>Payment Details</h2><form id="paymentForm" class="form"><input id="bankName" placeholder="Bank Name" required><input id="accountName" placeholder="Account Name" required><input id="accountNumber" placeholder="Account Number" required><input id="adminEmail" type="email" placeholder="Contact Email" required><button>Save Details</button></form></div><div id="ordersTab" hidden class="card"><h2>Orders</h2><div id="orders"></div></div></section></main><div id="productModal" class="modal" hidden><div class="modalBox"><button class="close">×</button><h2 id="modalTitle">Add Product</h2><form id="productForm" class="form"><input type="hidden" id="pid"><input id="pname" placeholder="Product name" required><input id="pprice" type="number" min="0" step="0.01" placeholder="Price in USD" required><input id="pstorage" placeholder="Storage e.g. 256GB"><input id="pdisplay" placeholder="Display e.g. 6.9 inch"><input id="pnetwork" placeholder="Network e.g. 5G"><textarea id="pdesc" placeholder="Description"></textarea><label>Product picture <input id="pimage" type="file" accept="image/*"></label><div id="preview"></div><button>Save Product</button></form></div></div><script src="app.js"></script></body></html>
