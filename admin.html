<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Contix Phone Pre-Order</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Contix Phones Admin</h1>
            <button id="logout-btn">Logout</button>
        </header>

        <main class="admin-main">
            <!-- Login Form -->
            <div id="login-view" class="view">
                <form id="login-form">
                    <h2>Admin Login</h2>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>

            <!-- Dashboard View -->
            <div id="dashboard-view" class="view" style="display: none;">
                <div class="dashboard-nav">
                    <button class="nav-btn active" data-view="products">Manage Products</button>
                    <button class="nav-btn" data-view="payments">Payment Settings</button>
                </div>

                <!-- Manage Products View -->
                <div id="products-view" class="sub-view">
                    <div class="section-header">
                        <h2>Products</h2>
                        <button id="add-product-btn" class="btn btn-secondary">+ Add New Product</button>
                    </div>
                    <div id="product-list" class="product-list">
                        <!-- Products will be loaded here -->
                    </div>
                </div>

                <!-- Payment Settings View -->
                <div id="payments-view" class="sub-view" style="display: none;">
                    <h2>Bank Account Details</h2>
                    <form id="payment-form">
                        <div class="form-group">
                            <label for="bank-name">Bank Name</label>
                            <input type="text" id="bank-name" required>
                        </div>
                        <div class="form-group">
                            <label for="account-name">Account Name</label>
                            <input type="text" id="account-name" required>
                        </div>
                        <div class="form-group">
                            <label for="account-number">Account Number</label>
                            <input type="text" id="account-number" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Details</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Add New Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" required>
