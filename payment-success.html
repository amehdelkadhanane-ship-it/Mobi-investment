<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — CONTIX</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap page center"><div class="panel"><p class="eyebrow">CONTIX ORDER</p><h1 id="title">Checking order...</h1><p id="message"></p><a class="btn" href="/">Back to store</a></div></main><script>const r=new URLSearchParams(location.search).get('reference');fetch('/api/orders/'+encodeURIComponent(r||'' )).then(x=>x.json()).then(o=>{if(o.error){title.textContent='Order not found';message.textContent=o.error;return}title.textContent='Order '+o.reference;message.textContent='Status: '+o.status+' · Payment: '+o.payment_status+' · Total: ₦'+Number(o.total).toLocaleString();}).catch(()=>{title.textContent='Unable to load order';message.textContent='Please try again.'});</script></body></html>
