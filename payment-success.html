<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — CONTIX</title><link rel="stylesheet" href="style.css"></head><body><main class="success"><h1>Payment verification</h1><p id="status">Checking your payment...</p><a href="/">Return to store</a></main><script src="config.js"></script><script>
(async()=>{const p=new URLSearchParams(location.search);const ref=p.get("reference");if(!ref){document.getElementById("status").textContent="No payment reference was provided.";return;}try{const r=await fetch((window.CONTIX_CONFIG?.API_BASE_URL||"")+"/api/paystack/verify/"+encodeURIComponent(ref));const d=await r.json();document.getElementById("status").textContent=d.status==="success"?"Payment successful. Your order is now being processed.":"Payment could not be confirmed yet. Please contact the store team with your reference: "+ref;}catch(e){document.getElementById("status").textContent="Verification is temporarily unavailable. Save your reference: "+ref;}})();
</script></body></html>
